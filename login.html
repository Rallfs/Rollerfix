
<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RollerFix - Pieslēgties</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-form">
            <div class="login-header">
                <img src="logo rollerfix.png" alt="RollerFix Logo" class="login-logo">
                <a href="index.html" class="back-button">Sākums</a>
            </div>
            <form id="loginForm">
                <input type="email" placeholder="Ievadiet savu e-pastu" id="email" required>
                <input type="password" placeholder="Ievadiet savu paroli" id="password" required>
                <button type="submit" class="login-btn">Ienākt</button>
            </form>
            <a href="#" class="forgot-password">Aizmirsu paroli.....</a>
            <a href="#" class="register-link">Reģistrēties</a>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
